name: Test
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: browser-actions/setup-chrome@v2
      - run: chrome --version
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install dependencies and run tests
        run: |
          corepack enable
          yarn install
          yarn ng test --no-watch --no-progress --code-coverage --browsers=ChromeHeadless
